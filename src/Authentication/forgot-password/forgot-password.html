<div class="container">
     <div class="Header"> <h1 class="heade-title">anytalk </h1></div>
    <div class="form-box">
        <form class="form">
            <span class="title">Enter Email to reset password</span>
            
            <div class="form-container">
                <input type="email" class="input" placeholder="Email" [(ngModel)]="email" name="email">
            </div>
            <button class="form-btn" (click)="resetpassword()">Reset Password</button>
        </form>
        <div class="form-section">
            <p>Have an account? <a [routerLink]="['/Sign-in']" routerLinkActive="router-link-active">Log in</a> </p>
        </div>
    </div>
</div>

</div>
